[project]
name = "ha-safe-intercom"
version = "0.1.0"
description = "Home Assistant integration for SAFE IP intercoms"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "PyTurboJPEG",  # needed to load the camera component in tests
    "pytest-homeassistant-custom-component",
    "ruff",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.safe_intercom"]
combine-as-imports = true
force-sort-within-sections = true
